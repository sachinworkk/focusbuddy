<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FocusBuddy</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="panel-header" id="panel-header">
      <span class="panel-header-title">FocusBuddy</span>
      <div class="panel-header-actions">
        <button class="panel-icon-btn" id="settings-toggle-btn" aria-label="Settings" aria-pressed="false">⚙</button>
        <button class="panel-close-btn" id="panel-close-btn" aria-label="Close">✕</button>
      </div>
    </header>

    <main class="panel-body">
      <section class="mascot-stage">
        <div class="mascot-sprite-wrap">
          <div class="avatar-shape" id="panel-avatar" data-mood="idle">
            <!-- Idle/nudge inlined (not <img>), kept in sync with src/renderer/mascot/idle.svg and nudge.svg. -->
            <svg class="mascot-img mascot-idle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
              <ellipse cx="64" cy="112" rx="30" ry="5" fill="#1e293b" opacity="0.5"/>
              <path d="M42 72 L46 106 C46 108 48 110 50 110 L78 110 C80 110 82 108 82 106 L86 72 Z" fill="#e06d53"/>
              <rect x="38" y="66" width="52" height="8" rx="2" fill="#ee7d63"/>
              <rect x="38" y="72" width="52" height="2" fill="#c85940"/>
              <ellipse cx="64" cy="67" rx="22" ry="3" fill="#5c3a21"/>
              <path d="M64 67 C64 50 63 38 64 28" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
              <path d="M64 45 C48 45 40 32 40 32 C40 32 54 30 64 41 Z" fill="#22c55e"/>
              <path d="M64 38 C80 38 88 25 88 25 C88 25 74 23 64 34 Z" fill="#4ade80"/>
              <circle cx="54" cy="88" r="2.3" fill="#2d3748"/>
              <circle cx="53" cy="87" r="0.6" fill="#ffffff"/>
              <circle cx="74" cy="88" r="2.3" fill="#2d3748"/>
              <circle cx="73" cy="87" r="0.6" fill="#ffffff"/>
              <path d="M61 92 Q64 95 67 92" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <img class="mascot-img mascot-focused" src="../mascot/focused.svg" alt="" />
            <svg class="mascot-img mascot-paused" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
              <ellipse cx="64" cy="112" rx="30" ry="5" fill="#1e293b" opacity="0.5"/>
              <path d="M42 72 L46 106 C46 108 48 110 50 110 L78 110 C80 110 82 108 82 106 L86 72 Z" fill="#e06d53"/>
              <rect x="38" y="66" width="52" height="8" rx="2" fill="#ee7d63"/>
              <rect x="38" y="72" width="52" height="2" fill="#c85940"/>
              <ellipse cx="64" cy="67" rx="22" ry="3" fill="#5c3a21"/>
              <path d="M64 67 C64 50 63 38 64 28" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
              <path d="M64 45 C48 45 40 32 40 32 C40 32 54 30 64 41 Z" fill="#22c55e"/>
              <path d="M64 38 C80 38 88 25 88 25 C88 25 74 23 64 34 Z" fill="#4ade80"/>
              <circle cx="54" cy="88" r="2.3" fill="#2d3748"/>
              <circle cx="74" cy="88" r="2.3" fill="#2d3748"/>
              <circle cx="53" cy="87" r="0.6" fill="#ffffff"/>
              <circle cx="73" cy="87" r="0.6" fill="#ffffff"/>
              <path d="M61 92 Q64 95 67 92" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <img class="mascot-img mascot-celebrating" src="../mascot/celebrating.svg" alt="" />
            <svg class="mascot-img mascot-nudge" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
              <ellipse cx="64" cy="112" rx="30" ry="5" fill="#1e293b" opacity="0.5"/>
              <path d="M92 46 C92 46 98 54 95 58 C92 61 87 59 87 55 C87 51 92 46 92 46 Z" fill="#38bdf8"/>
              <path d="M42 72 L46 106 C46 108 48 110 50 110 L78 110 C80 110 82 108 82 106 L86 72 Z" fill="#e06d53"/>
              <rect x="38" y="66" width="52" height="8" rx="2" fill="#ee7d63"/>
              <ellipse cx="64" cy="67" rx="22" ry="3" fill="#78350f"/>
              <path d="M64 67 C64 55 52 48 48 38" fill="none" stroke="#84cc16" stroke-width="4" stroke-linecap="round"/>
              <path d="M50 42 C38 48 34 60 34 60 C34 60 46 56 52 46 Z" fill="#65a30d"/>
              <path d="M46 36 C40 26 28 28 28 28 C28 28 34 38 44 38 Z" fill="#84cc16"/>
              <circle cx="54" cy="88" r="2.3" fill="#2d3748"/>
              <circle cx="53" cy="87" r="0.6" fill="#ffffff"/>
              <circle cx="74" cy="88" r="2.3" fill="#2d3748"/>
              <circle cx="73" cy="87" r="0.6" fill="#ffffff"/>
              <path d="M60 93 Q64 94.5 68 93" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </section>

      <section class="panel-section panel-card" id="timer-section">
        <div class="timer-task" id="timer-task">No task selected</div>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <label class="timer-duration-label">
            Minutes
            <input type="number" id="timer-minutes" min="1" max="180" />
          </label>
          <label class="timer-checkbox-label">
            <input type="checkbox" id="mark-complete-checkbox" />
            Mark task complete in TickTick when done
          </label>
          <label class="timer-checkbox-label">
            <input type="checkbox" id="block-sites-checkbox" />
            Block distracting sites during this session
          </label>
          <div class="timer-buttons">
            <button id="timer-start-btn" class="btn btn-primary">Start</button>
            <button id="timer-pause-btn" class="btn" hidden>Pause</button>
            <button id="timer-resume-btn" class="btn btn-primary" hidden>Resume</button>
            <button id="timer-reset-btn" class="btn" hidden>Reset</button>
          </div>
          <p class="placeholder" id="session-status" hidden></p>
        </div>
      </section>

      <section class="panel-section panel-card" id="tasks-section">
        <div class="section-header">
          <h2>Tasks</h2>
          <button id="refresh-tasks-btn" class="link-btn" hidden>Refresh</button>
        </div>
        <p class="placeholder" id="tasks-status">Connect TickTick to see your tasks.</p>
        <ul class="task-list" id="task-list" hidden></ul>
      </section>

      <section class="panel-section panel-card panel-card-quiet" id="settings-section" hidden>
        <h2>Settings</h2>
        <div class="settings-row">
          <span id="ticktick-status">Not connected to TickTick.</span>
          <button id="ticktick-connect-btn" class="btn">Connect TickTick</button>
          <button id="ticktick-logout-btn" class="btn" hidden>Disconnect</button>
        </div>
        <div class="settings-row">
          <span id="blocking-status">Sites not blocked.</span>
          <button id="unblock-now-btn" class="link-btn" hidden>Unblock now</button>
        </div>
        <p class="placeholder" id="blocking-domains-hint"></p>

        <div class="settings-divider"></div>

        <div class="settings-row">
          <label class="timer-duration-label" style="flex:1">
            Default session length (minutes)
            <input type="number" id="default-minutes-input" min="1" max="180" />
          </label>
        </div>
        <div class="settings-row">
          <label class="timer-checkbox-label">
            <input type="checkbox" id="default-mark-complete-checkbox" />
            Mark task complete in TickTick by default
          </label>
        </div>
        <div class="settings-row">
          <label class="timer-checkbox-label">
            <input type="checkbox" id="default-block-sites-checkbox" />
            Block distracting sites by default
          </label>
        </div>
        <p class="placeholder" id="settings-saved-hint" hidden>Saved.</p>
      </section>
    </main>

    <script src="sounds.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
