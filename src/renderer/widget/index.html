<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FocusBuddy Widget</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="avatar" id="avatar" data-mood="idle">
      <div class="progress-ring" id="progressRing"></div>
      <div class="avatar-body">
        <div class="avatar-face">
          <div class="brow brow-left"></div>
          <div class="brow brow-right"></div>
          <div class="eye eye-left"></div>
          <div class="eye eye-right"></div>
          <div class="mouth"></div>
        </div>
        <div class="blush blush-left"></div>
        <div class="blush blush-right"></div>
      </div>
      <div class="sparkle sparkle-1"></div>
      <div class="sparkle sparkle-2"></div>
      <div class="sparkle sparkle-3"></div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
