<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FocusBuddy Widget</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="avatar" id="avatar" data-mood="idle">
      <div class="progress-ring" id="progressRing"></div>
      <div class="avatar-shape">
        <img class="mascot-img mascot-idle" src="../mascot/idle.svg" alt="" draggable="false" />
        <img class="mascot-img mascot-focused" src="../mascot/focused.svg" alt="" draggable="false" />
        <img class="mascot-img mascot-paused" src="../mascot/idle.svg" alt="" draggable="false" />
        <img class="mascot-img mascot-celebrating" src="../mascot/celebrating.svg" alt="" draggable="false" />
        <img class="mascot-img mascot-nudge" src="../mascot/nudge.svg" alt="" draggable="false" />
      </div>
      <div class="sparkle sparkle-1"></div>
      <div class="sparkle sparkle-2"></div>
      <div class="sparkle sparkle-3"></div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
