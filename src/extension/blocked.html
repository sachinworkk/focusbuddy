<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Blocked — FocusBuddy</title>
<style>
  /* KEEP IN SYNC MANUALLY with src/renderer/theme.css — this page runs at
     chrome-extension:// (separate origin/package) and can't share the file. */
  :root {
    --fb-bg: #16171d;
    --fb-surface: #1e1f27;
    --fb-surface-raised: #262733;
    --fb-border: #2f303b;
    --fb-text: #f2f2f6;
    --fb-text-muted: #9a9bab;
    --fb-text-faint: #6f7080;
    --fb-accent: #7c9fff;
    --fb-accent-soft: rgba(124, 159, 255, 0.16);
    --fb-accent-strong: #91b0ff;
    --fb-accent-warm: #e8934a;
    --fb-warning: #e3a765;
    --fb-radius-lg: 16px;
    --fb-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --fb-font-mono: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
  }

  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--fb-bg);
    color: var(--fb-text);
    font-family: var(--fb-font);
  }

  .card {
    text-align: center;
    max-width: 360px;
    padding: 32px;
    background: var(--fb-surface);
    border: 1px solid var(--fb-border);
    border-radius: var(--fb-radius-lg);
  }

  .avatar {
    margin: 0 auto 12px;
    width: 110px;
  }

  .avatar svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    animation: breathe 3s ease-in-out infinite;
  }

  .avatar .mascot-celebrating {
    display: none;
  }

  .avatar.is-done .mascot-focused {
    display: none;
  }

  .avatar.is-done .mascot-celebrating {
    display: block;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }

  p {
    margin: 4px 0;
    color: var(--fb-text-muted);
    font-size: 14px;
  }

  .task {
    margin-top: 20px;
    color: var(--fb-text-muted);
    font-size: 14px;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
</style>
</head>
