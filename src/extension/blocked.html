<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Blocked — FocusBuddy</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c1b29;
    color: #f2f0ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    text-align: center;
    max-width: 360px;
    padding: 32px;
  }
  .avatar { font-size: 56px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 4px 0; color: #b8b4d6; font-size: 14px; }
  .timer {
    margin-top: 20px;
    font-size: 32px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .task { margin-top: 4px; color: #d8d5f0; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">🌱</div>
    <h1>This page is taking a break</h1>
    <p>FocusBuddy is blocking distractions until your Pomodoro finishes.</p>
    <div class="timer" id="timer">--:--</div>
    <div class="task" id="task"></div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
