<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Blocked — FocusBuddy</title>
<style>
  /* KEEP IN SYNC MANUALLY with src/renderer/theme.css — this page runs at
     chrome-extension:// (separate origin/package) and can't share the file. */
  :root {
    --fb-bg: #16171d;
    --fb-surface: #1e1f27;
    --fb-surface-raised: #262733;
    --fb-border: #2f303b;
    --fb-text: #f2f2f6;
    --fb-text-muted: #9a9bab;
    --fb-text-faint: #6f7080;
    --fb-accent: #7c9fff;
    --fb-accent-soft: rgba(124, 159, 255, 0.16);
    --fb-accent-strong: #91b0ff;
    --fb-accent-warm: #e8934a;
    --fb-warning: #e3a765;
    --fb-dumpling-body: #ecd0aa;
    --fb-dumpling-body-shade: #d1a878;
    --fb-dumpling-plate: #2b2420;
    --fb-dumpling-blush: #f0a0a0;
    --fb-dumpling-ink: #4a3626;
    --fb-radius-lg: 16px;
    --fb-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --fb-font-mono: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
  }

  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--fb-bg);
    color: var(--fb-text);
    font-family: var(--fb-font);
  }

  .card {
    text-align: center;
    max-width: 360px;
    padding: 32px;
    background: var(--fb-surface);
    border: 1px solid var(--fb-border);
    border-radius: var(--fb-radius-lg);
  }

  .avatar {
    margin: 0 auto 12px;
    width: 110px;
  }

  .avatar svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    animation: breathe 3s ease-in-out infinite;
  }

  .avatar .plate { fill: var(--fb-dumpling-plate); }

  .avatar .dome {
    fill: var(--fb-dumpling-body);
    stroke: var(--fb-dumpling-body-shade);
    stroke-width: 1.5;
  }

  .avatar .pleat {
    fill: none;
    stroke: var(--fb-dumpling-body-shade);
    stroke-width: 1.3;
    stroke-linecap: round;
    opacity: 0.8;
  }

  .avatar .blush {
    fill: var(--fb-dumpling-blush);
    opacity: 0.55;
  }

  .avatar .eye {
    fill: var(--fb-dumpling-ink);
    transform-box: fill-box;
    transform-origin: center;
    animation: fb-blink 5.5s ease-in-out infinite;
  }

  .avatar .eye-right {
    animation-delay: 0.12s;
  }

  .avatar .mouth {
    fill: none;
    stroke: var(--fb-dumpling-ink);
    stroke-width: 2.2;
    stroke-linecap: round;
  }

  @keyframes fb-blink {
    0%, 94%, 100% { transform: scaleY(1); }
    97% { transform: scaleY(0.15); }
  }

  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }

  p {
    margin: 4px 0;
    color: var(--fb-text-muted);
    font-size: 14px;
  }

  .timer {
    margin-top: 20px;
    font-family: var(--fb-font-mono);
    font-size: 32px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--fb-accent-warm);
  }

  .task {
    margin-top: 4px;
    color: var(--fb-text-muted);
    font-size: 14px;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="64" height="64">
        <ellipse class="plate" cx="32" cy="47" rx="23" ry="6" />
        <path
          class="dome"
          d="M9 42 C9 24 18 12 32 12 C46 12 55 24 55 42 C55 48 46 50 32 50 C18 50 9 48 9 42 Z"
        />
        <g class="pleats">
          <path class="pleat" d="M32 12 Q26 19 21 26" />
          <path class="pleat" d="M32 12 Q29 19 27 26" />
          <path class="pleat" d="M32 12 Q32 19 32 26" />
          <path class="pleat" d="M32 12 Q35 19 37 26" />
          <path class="pleat" d="M32 12 Q38 19 43 26" />
        </g>
        <ellipse class="blush" cx="20" cy="38" rx="3.6" ry="2.2" />
        <ellipse class="blush" cx="44" cy="38" rx="3.6" ry="2.2" />
        <circle class="eye eye-left" cx="24" cy="32" r="2.6" />
        <circle class="eye eye-right" cx="40" cy="32" r="2.6" />
        <path class="mouth" d="M25 41 q7 5 14 0" />
      </svg>
    </div>
    <h1>I've got this one.</h1>
    <p>FocusBuddy is gently keeping this site out of reach until your Pomodoro finishes.</p>
    <div class="timer" id="timer">--:--</div>
    <div class="task" id="task"></div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
